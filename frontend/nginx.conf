server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Built JS/CSS have a content hash in the file name, so they can be cached long-term.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html (and every client-side route that falls back to it) must always be
    # revalidated, so browsers pick up the new asset names right after a deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
