services:
  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    environment:
      APP_NAME: Sales Inventory System
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: http://${PUBLIC_HOST:-localhost}:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sales_db
      DB_USERNAME: sales_user
      DB_PASSWORD: sales_password
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      # Team integration (B6) – galing sa .env katabi ng file na ito
      SYSTEM_CODE: "${SYSTEM_CODE:-CRM}"
      INTEGRATION_ENABLED: "${INTEGRATION_ENABLED:-false}"
      INTEGRATION_API_KEY: "${INTEGRATION_API_KEY:-}"
      CRM_API_URL: "${CRM_API_URL:-}"
      CRM_API_KEY: "${CRM_API_KEY:-}"
      PROC_API_URL: "${PROC_API_URL:-}"
      PROC_API_KEY: "${PROC_API_KEY:-}"
      INV_API_URL: "${INV_API_URL:-}"
      INV_API_KEY: "${INV_API_KEY:-}"
      HR_API_URL: "${HR_API_URL:-}"
      HR_API_KEY: "${HR_API_KEY:-}"
    depends_on:
      db:
        condition: service_healthy

  db:
    restart: unless-stopped
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: sales_db
      MYSQL_USER: sales_user
      MYSQL_PASSWORD: sales_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1 (TCP) so the check only passes once the real server is up,
      # not the temporary socket-only server used during first-time init.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://${PUBLIC_HOST:-localhost}:8000/api
    ports:
      - "5173:80"
    depends_on:
      - app

volumes:
  mysql_data:
